name: PR verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: make test
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.18.6
      - name: Build clusterctl assets and Helm chart
        run: make release
      - name: Working tree matches generated chart
        run: git diff --exit-code
      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            out/infrastructure-components.yaml
            out/metadata.yaml
            out/cluster-template.yaml
            out/*.tgz

  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build manager image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          provenance: false
          sbom: false
          tags: ghcr.io/flippyboy/cluster-api-provider-hyperv:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
