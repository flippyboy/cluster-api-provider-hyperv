---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: hypervclusters.infrastructure.cluster.x-k8s.io
spec:
  group: infrastructure.cluster.x-k8s.io
  names:
    categories:
    - cluster-api
    kind: HyperVCluster
    listKind: HyperVClusterList
    plural: hypervclusters
    shortNames:
    - hvcl
    singular: hypervcluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.host.address
      name: Host
      type: string
    - jsonPath: .spec.host.transport
      name: Transport
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: HyperVCluster is the Schema for hypervclusters API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: HyperVClusterSpec defines the desired state of HyperVCluster.
            properties:
              credentialsSecretRef:
                description: |-
                  credentialsSecretRef names a Secret in the same namespace.
                  SSH keys: username, ssh-privatekey, and ssh-known-hosts unless host
                  key verification is skipped.
                  WinRM keys: username and password. NTLM is the authentication method.
                  Optional WinRM key: ca-cert, a PEM bundle for the HTTPS listener.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              host:
                description: host is the Hyper-V host that will run every machine
                  in this cluster.
                properties:
                  address:
                    description: address is the host name or IP of the Hyper-V host.
                    maxLength: 512
                    minLength: 1
                    type: string
                  insecureSkipHostKeyVerification:
                    description: insecureSkipHostKeyVerification skips SSH host key
                      checks.
                    type: boolean
                  insecureSkipTLSVerify:
                    description: insecureSkipTLSVerify skips TLS verification for
                      WinRM HTTPS.
                    type: boolean
                  port:
                    description: |-
                      port is the TCP port. When unset, SSH uses 22, WinRM HTTP uses 5985,
                      and WinRM HTTPS uses 5986.
                    format: int32
                    maximum: 65535
                    minimum: 0
                    type: integer
                  tlsServerName:
                    description: |-
                      tlsServerName overrides the name checked against the WinRM server
                      certificate. Set this when address is an IP and the certificate is
                      issued to a DNS name.
                    maxLength: 512
                    type: string
                  transport:
                    default: SSH
                    description: transport selects SSH or WinRM. Defaults to SSH.
                    enum:
                    - SSH
                    - WinRM
                    type: string
                  winRMScheme:
                    default: HTTPS
                    description: |-
                      winRMScheme selects the WinRM listener when transport is WinRM.
                      Defaults to HTTPS.
                    enum:
                    - HTTP
                    - HTTPS
                    type: string
                required:
                - address
                type: object
              imagePath:
                description: |-
                  imagePath is the golden VHDX on the host. Differencing disks use it as
                  their parent, so it must stay immutable.
                maxLength: 1024
                minLength: 1
                type: string
              kubeVIP:
                description: |-
                  kubeVIP installs kube-vip on control plane machines. The virtual IP is
                  Cluster.spec.controlPlaneEndpoint. Leave this unset when that endpoint
                  is a DHCP reservation or another load balancer.
                properties:
                  enabled:
                    description: |-
                      enabled adds the kube-vip static pod to control plane cloud-init.
                      Workers are left unchanged. The mode is ARP on the guest NIC.
                    type: boolean
                  image:
                    default: ghcr.io/kube-vip/kube-vip:v1.3.0
                    description: image overrides the kube-vip container image.
                    maxLength: 512
                    minLength: 1
                    type: string
                  interface:
                    default: eth0
                    description: |-
                      interface is the guest interface that holds the virtual IP.
                      The NoCloud network-config renames the matched NIC to this name.
                    maxLength: 15
                    minLength: 1
                    pattern: ^[A-Za-z][A-Za-z0-9_-]{0,14}$
                    type: string
                type: object
              virtualSwitch:
                description: |-
                  virtualSwitch is the name of an external virtual switch that already
                  exists on the host.
                maxLength: 256
                minLength: 1
                type: string
              vmPath:
                description: |-
                  vmPath is the directory under which each VM folder is created. When
                  empty, the host default virtual machine path is used.
                maxLength: 1024
                type: string
            required:
            - credentialsSecretRef
            - host
            - imagePath
            - virtualSwitch
            type: object
          status:
            description: HyperVClusterStatus defines the observed state of HyperVCluster.
            properties:
              conditions:
                description: |-
                  conditions represent the observations of the cluster.
                  The Ready condition is mirrored onto Cluster InfrastructureReady.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 32
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              initialization:
                description: initialization reports contract provisioning state.
                minProperties: 1
                properties:
                  provisioned:
                    description: provisioned is true when machines may be created.
                      It is set once.
                    type: boolean
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
